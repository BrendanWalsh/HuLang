<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">The abstraction timeline</title>
  <desc id="desc">Eight generations of programming languages, from machine code in the 1940s to HuLang in 2025. Each bar shows how much of the machine a programmer still has to describe by hand; the bars get shorter every generation.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --bar: #d0d7de;
      --bar-now: #2da44e;
      --rule: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --faint: #8b949e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bar: #30363d;
        --bar-now: #3fb950;
        --rule: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --faint: #6e7681;
      }
    }

    .background { fill: var(--bg); }
    .bar { fill: var(--bar); }
    .bar-now { fill: var(--bar-now); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .era { fill: var(--faint); font: 600 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
    .lang { fill: var(--text); font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .lang-now { fill: var(--bar-now); font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .quip { fill: var(--muted); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axis { fill: var(--muted); font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <rect class="background" x="0" y="0" width="920" height="430" rx="10" />

  <text class="axis" x="28" y="34">Bar length is how much of the machine you still have to describe yourself.</text>
  <path class="rule" d="M 96 47.5 H 892" />
  <path class="rule" d="M 96.5 44 V 52" />

  <g transform="translate(0 62)">
    <rect class="bar" x="96" y="0" width="480" height="13" rx="3" />
    <text class="era" x="28" y="11">1940s</text>
    <text class="lang" x="588" y="11">Machine code</text>
    <text class="quip" x="96" y="30">Raw binary. Toggle switches. Pain.</text>
  </g>

  <g transform="translate(0 106)">
    <rect class="bar" x="96" y="0" width="408" height="13" rx="3" />
    <text class="era" x="28" y="11">1950s</text>
    <text class="lang" x="516" y="11">Assembly</text>
    <text class="quip" x="96" y="30">MOV AX, feelings. Still pain.</text>
  </g>

  <g transform="translate(0 150)">
    <rect class="bar" x="96" y="0" width="336" height="13" rx="3" />
    <text class="era" x="28" y="11">1970s</text>
    <text class="lang" x="444" y="11">C</text>
    <text class="quip" x="96" y="30">Portable. Revolutionary. Segfaults.</text>
  </g>

  <g transform="translate(0 194)">
    <rect class="bar" x="96" y="0" width="312" height="13" rx="3" />
    <text class="era" x="28" y="11">1980s</text>
    <text class="lang" x="420" y="11">C++</text>
    <text class="quip" x="96" y="30">We need objects. Also templates.</text>
  </g>

  <g transform="translate(0 238)">
    <rect class="bar" x="96" y="0" width="288" height="13" rx="3" />
    <text class="era" x="28" y="11">1990s</text>
    <text class="lang" x="396" y="11">Java</text>
    <text class="quip" x="96" y="30">Write once, debug everywhere.</text>
  </g>

  <g transform="translate(0 282)">
    <rect class="bar" x="96" y="0" width="216" height="13" rx="3" />
    <text class="era" x="28" y="11">2000s</text>
    <text class="lang" x="324" y="11">Python</text>
    <text class="quip" x="96" y="30">Beautiful is better than ugly. Slow is better than — wait.</text>
  </g>

  <g transform="translate(0 326)">
    <rect class="bar" x="96" y="0" width="168" height="13" rx="3" />
    <text class="era" x="28" y="11">2020s</text>
    <text class="lang" x="276" y="11">AI assistants</text>
    <text class="quip" x="96" y="30">You write the code, the model finishes your sentences.</text>
  </g>

  <g transform="translate(0 370)">
    <rect class="bar-now" x="96" y="0" width="12" height="13" rx="3" />
    <text class="era" x="28" y="11">2025</text>
    <text class="lang-now" x="120" y="11">HuLang</text>
    <text class="quip" x="96" y="30">You write natural language. You get a binary.</text>
  </g>
</svg>
