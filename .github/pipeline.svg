<svg xmlns="http://www.w3.org/2000/svg" width="920" height="160" viewBox="0 0 920 160" role="img" aria-labelledby="title desc">
  <title id="title">HuLang compilation pipeline</title>
  <desc id="desc">program.txt is translated by the LLM frontend into C, compiled by gcc, and emitted as a native binary.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --box: #f6f8fa;
      --box-out: #f0fff4;
      --border: #d0d7de;
      --border-out: #2da44e;
      --text: #24292f;
      --muted: #57606a;
      --arrow: #57606a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --box: #161b22;
        --box-out: #0f2419;
        --border: #30363d;
        --border-out: #3fb950;
        --text: #e6edf3;
        --muted: #8b949e;
        --arrow: #8b949e;
      }
    }

    .background { fill: var(--bg); }
    .node { fill: var(--box); stroke: var(--border); stroke-width: 1.5; }
    .output { fill: var(--box-out); stroke: var(--border-out); stroke-width: 1.5; }
    .title { fill: var(--text); font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { fill: var(--muted); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { stroke: var(--arrow); stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--arrow)" />
    </marker>
  </defs>

  <rect class="background" x="0" y="0" width="920" height="160" rx="10" />

  <g transform="translate(30 48)">
    <rect class="node" x="0" y="0" width="170" height="92" rx="10" />
    <text class="title" x="85" y="30" text-anchor="middle">program.txt</text>
    <text class="body" x="85" y="55" text-anchor="middle">natural language</text>
    <text class="body" x="85" y="74" text-anchor="middle">source file</text>
  </g>

  <g transform="translate(260 48)">
    <rect class="node" x="0" y="0" width="170" height="92" rx="10" />
    <text class="title" x="85" y="30" text-anchor="middle">LLM frontend</text>
    <text class="body" x="85" y="55" text-anchor="middle">emits complete</text>
    <text class="body" x="85" y="74" text-anchor="middle">C translation</text>
  </g>

  <g transform="translate(490 48)">
    <rect class="node" x="0" y="0" width="170" height="92" rx="10" />
    <text class="title" x="85" y="30" text-anchor="middle">gcc</text>
    <text class="body" x="85" y="55" text-anchor="middle">compiles optimized</text>
    <text class="body" x="85" y="74" text-anchor="middle">machine code</text>
  </g>

  <g transform="translate(720 48)">
    <rect class="output" x="0" y="0" width="170" height="92" rx="10" />
    <text class="title" x="85" y="30" text-anchor="middle">./program</text>
    <text class="body" x="85" y="55" text-anchor="middle">native binary</text>
    <text class="body" x="85" y="74" text-anchor="middle">runs anywhere</text>
  </g>

  <path class="arrow" d="M 200 94 H 250" marker-end="url(#arrowhead)" />
  <path class="arrow" d="M 430 94 H 480" marker-end="url(#arrowhead)" />
  <path class="arrow" d="M 660 94 H 710" marker-end="url(#arrowhead)" />
</svg>
